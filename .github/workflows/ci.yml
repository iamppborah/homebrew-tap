name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cask:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Audit every cask
        run: |
          set -euo pipefail

          dir="$(brew --repository)/Library/Taps/${GITHUB_REPOSITORY}"
          tap="${GITHUB_REPOSITORY%%/*}/${GITHUB_REPOSITORY##*/homebrew-}"
          mkdir -p "$(dirname "${dir}")"
          ln -s "${GITHUB_WORKSPACE}" "${dir}"

          failed=""
          for f in Casks/*.rb; do
            cask="$(basename "${f}" .rb)"
            brew audit --cask --online "${tap}/${cask}" || failed="${failed} ${cask}"
          done

          if [ -n "${failed}" ]; then
            echo "audit failed:${failed}"
            exit 1
          fi
