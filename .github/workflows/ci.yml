name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cask:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      # brew only picks up the token under the name HOMEBREW_GITHUB_API_TOKEN. Without it the
      # audit calls the GitHub API anonymously, which runs out at 60 requests an hour.
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Audit every cask
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          dir="$(brew --repository)/Library/Taps/${GITHUB_REPOSITORY}"
          tap="${GITHUB_REPOSITORY%%/*}/${GITHUB_REPOSITORY##*/homebrew-}"
          mkdir -p "$(dirname "${dir}")"
          ln -s "${GITHUB_WORKSPACE}" "${dir}"

          base=""
          case "${GITHUB_EVENT_NAME}" in
            pull_request) base="HEAD^1" ;;
            push) base="${BEFORE}" ;;
          esac
          if [ -n "${base}" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=""
          fi

          changed=""
          if [ -n "${base}" ]; then
            changed="$(git diff --name-only "${base}" HEAD -- Casks/)"
          fi

          failed=""
          for f in Casks/*.rb; do
            cask="$(basename "${f}" .rb)"
            except=""
            if [ -n "${base}" ] && ! grep -qxF "${f}" <<<"${changed}"; then
              except="--except=livecheck_version"
            fi
            brew audit --cask --online ${except} "${tap}/${cask}" || failed="${failed} ${cask}"
          done

          if [ -n "${failed}" ]; then
            echo "audit failed:${failed}"
            exit 1
          fi
