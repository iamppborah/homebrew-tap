name: Update casks

on:
  schedule:
    - cron: "30 2 * * 6"   # Saturdays 02:30 UTC = 08:00 IST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cask: pomotroid
            repo: Splode/pomotroid
            asset: Pomotroid_{version}_universal.dmg
          - cask: r2
            repo: dickwu/r2
            asset: r2_{version}_aarch64.dmg
          - cask: tinycast
            repo: abue-ammar/tinycast
            asset: Tinycast-{version}.dmg
          - cask: tokeneater
            repo: AThevon/TokenEater
            asset: TokenEater.dmg

    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.TAP_BOT_APP_ID }}
          private-key: ${{ secrets.TAP_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Bump ${{ matrix.cask }}
        env:
          CASK: ${{ matrix.cask }}
          REPO: ${{ matrix.repo }}
          ASSET: ${{ matrix.asset }}
          # Reading another repository's releases is outside the app's installation, so that one
          # call keeps GITHUB_TOKEN. Everything touching this repository goes through gh, which
          # reads GH_TOKEN first and falls back to GITHUB_TOKEN — so the app token has to be
          # named GH_TOKEN.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail
          file="Casks/${CASK}.rb"

          tag="$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases/latest" | jq -r .tag_name)"
          version="${tag#v}"
          pinned="$(grep -m1 '^  version "' "${file}" | cut -d'"' -f2)"
          [ "${version}" = "${pinned}" ] && { echo "${CASK} ${version}: up to date"; exit 0; }

          branch="bump/${CASK}-${version}"
          if gh pr list --head "${branch}" --state open --json number --jq '.[].number' | grep -q .; then
            echo "PR already open for ${branch}"
            exit 0
          fi

          sha="$(curl -fsSL "https://github.com/${REPO}/releases/download/${tag}/${ASSET//\{version\}/${version}}" \
            | sha256sum | cut -d' ' -f1)"
          echo "${CASK} ${version} ${sha}"

          sed -i "s|^  version \".*\"|  version \"${version}\"|" "${file}"
          sed -i "s|^  sha256 \".*\"|  sha256 \"${sha}\"|" "${file}"
          ruby -c "${file}"

          bot_id="$(gh api "/users/${BOT}" --jq .id)"
          git config user.name "${BOT}"
          git config user.email "${bot_id}+${BOT}@users.noreply.github.com"
          git switch -c "${branch}"
          git commit -am "${CASK} ${version}" \
            -m "${pinned} -> ${version} — https://github.com/${REPO}/releases/tag/${tag}"
          git push --force origin "${branch}"

          gh pr create \
            --base main \
            --title "${CASK} ${version}" \
            --body "${pinned} -> ${version} — https://github.com/${REPO}/releases/tag/${tag}"
