name: Update casks

on:
  schedule:
    - cron: "30 2 * * 6"   # Saturdays 02:30 UTC = 08:00 IST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - cask: pomotroid
            repo: Splode/pomotroid
            asset: Pomotroid_{version}_universal.dmg
          - cask: r2
            repo: dickwu/r2
            asset: r2_{version}_aarch64.dmg
          - cask: tinycast
            repo: abue-ammar/tinycast
            asset: Tinycast-{version}.dmg

    steps:
      - uses: actions/checkout@v7
        with:
          # Events raised by the default GITHUB_TOKEN don't start workflow runs, so a PR
          # opened with it lands with ci.yml sitting in "Approve and run". Set a BUMP_TOKEN
          # secret (a PAT with contents + pull-requests write) and the audit runs on its own.
          token: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Bump ${{ matrix.cask }}
        env:
          CASK: ${{ matrix.cask }}
          REPO: ${{ matrix.repo }}
          ASSET: ${{ matrix.asset }}
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          file="Casks/${CASK}.rb"

          tag="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases/latest" | jq -r .tag_name)"
          version="${tag#v}"
          pinned="$(grep -m1 '^  version "' "${file}" | cut -d'"' -f2)"
          [ "${version}" = "${pinned}" ] && { echo "${CASK} ${version}: up to date"; exit 0; }

          # One branch per cask per version, so a rerun before you merge is a no-op
          # rather than a second PR for the same bump.
          branch="bump/${CASK}-${version}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "${branch} already pushed; leaving the open PR alone"
            exit 0
          fi

          sha="$(curl -fsSL "https://github.com/${REPO}/releases/download/${tag}/${ASSET//\{version\}/${version}}" \
            | sha256sum | cut -d' ' -f1)"
          echo "${CASK} ${version} ${sha}"

          sed -i "s|^  version \".*\"|  version \"${version}\"|" "${file}"
          sed -i "s|^  sha256 \".*\"|  sha256 \"${sha}\"|" "${file}"
          ruby -c "${file}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git commit -am "${CASK} ${version}" -m "${pinned} -> ${version}

          sha256 ${sha}
          https://github.com/${REPO}/releases/tag/${tag}"
          git push -u origin "${branch}"

          gh pr create \
            --base main \
            --head "${branch}" \
            --title "${CASK} ${version}" \
            --body "Bumps \`${CASK}\` from \`${pinned}\` to \`${version}\`.

          sha256 \`${sha}\`

          Upstream release: https://github.com/${REPO}/releases/tag/${tag}"
